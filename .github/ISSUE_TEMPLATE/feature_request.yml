name: Feature request
description: Suggest a tool, agent or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? For new tools, describe inputs, outputs and safety limits.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
