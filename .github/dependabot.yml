version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      three:
        patterns: ['three', '@react-three/*', '@types/three']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'vitest', '@vitest/*', 'typescript']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
